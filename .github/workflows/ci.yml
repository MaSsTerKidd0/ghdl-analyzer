name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  build:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      # Test builds you can download from the run's "Artifacts" section
      # (no release needed). Kept for 14 days.
      - uses: actions/upload-artifact@v4
        with:
          name: ghdl-analyzer-${{ runner.os }}
          path: |
            target/release/ghdl-analyzer
            target/release/ghdl-analyzer.exe
          if-no-files-found: error
          retention-days: 14

  # Regenerate the example waveforms with a real GHDL release and run the tests on
  # them, so a change in GHDL's output formats is caught early.
  ghdl:
    name: GHDL ${{ matrix.ghdl }} compatibility
    strategy:
      fail-fast: false
      matrix:
        ghdl: ["6.0.0"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install GHDL ${{ matrix.ghdl }}
        run: |
          url="https://github.com/ghdl/ghdl/releases/download/v${{ matrix.ghdl }}/ghdl-mcode-${{ matrix.ghdl }}-ubuntu24.04-x86_64.tar.gz"
          mkdir -p "$RUNNER_TEMP/ghdl"
          curl -sSfL "$url" | tar xz -C "$RUNNER_TEMP/ghdl" --strip-components=1
          echo "$RUNNER_TEMP/ghdl/bin" >> "$GITHUB_PATH"
      - run: ghdl --version
      - name: Regenerate example waveforms
        run: examples/vhdl/generate.sh
      - name: Show changes in the generated files (informational)
        run: git diff --stat -- examples/
      - run: cargo test
